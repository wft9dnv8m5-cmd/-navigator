<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<title>Штурман — справочник автомобилиста, Москва</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#142033;--mut:#5d6b7c;--line:#dbe2ea;--brand:#1b3a5c;--acc:#f5a524;--g:#16a34a}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{height:100dvh}button,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 Manrope,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.bb{width:42px;height:42px;border:0;border-radius:12px;background:var(--bg);font-size:22px;cursor:pointer}
.brand{display:flex;align-items:center;gap:10px}.brand svg{width:38px;height:38px}
.brand b{display:block;font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1}.brand small{color:var(--mut);font-size:12px}
main{flex:1;min-height:0;position:relative}
.v{display:none;position:absolute;inset:0;overflow:auto}.v.on{display:block}
#map{position:absolute;inset:0}
.chips{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;overflow-x:auto;z-index:500;scrollbar-width:none}
.chip{border:0;padding:9px 14px;border-radius:99px;background:var(--card);font-weight:700;font-size:13px;box-shadow:0 2px 8px #0003;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--brand);color:#fff}
#st{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:500;background:var(--card);padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700;box-shadow:0 2px 10px #0003;max-width:90%;text-align:center}
#loc{position:absolute;right:10px;bottom:110px;z-index:500;width:42px;height:42px;border:0;border-radius:12px;background:var(--card);font-size:20px;box-shadow:0 2px 8px #0003;cursor:pointer}
.pin{width:28px;height:28px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-size:13px;box-shadow:0 2px 6px #0005}
.pop{font:500 13px/1.5 Manrope,system-ui,sans-serif}.pop b{font-size:15px}.pop span{color:var(--mut)}
.pop a{display:inline-block;margin-top:6px;padding:6px 12px;border-radius:8px;background:var(--brand);color:#fff;text-decoration:none;font-weight:700}
.rt button{margin:4px 3px 0 0;border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 7px;cursor:pointer}
.wrap{max-width:660px;margin:0 auto;padding:18px 16px 40px}
.wrap h2{margin:4px 0;font-size:24px;letter-spacing:-.4px}.wrap>p{margin:0 0 16px;color:var(--mut)}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:13px 15px}
summary{font-weight:700;cursor:pointer}details ol{margin:10px 0 0;padding-left:20px;color:var(--mut)}
.ck{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:8px;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--brand)}.ck.d span{text-decoration:line-through;color:var(--mut)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;width:0;background:var(--g);transition:width .3s}
#dr{position:fixed;top:0;bottom:0;left:0;width:290px;max-width:84%;background:var(--card);transform:translateX(-105%);transition:transform .25s;z-index:2000;padding:16px 14px;display:flex;flex-direction:column;gap:4px;box-shadow:6px 0 24px #0004}
#sh{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .25s;z-index:1900}
body.open #dr{transform:none}body.open #sh{opacity:1;pointer-events:auto}
#dr .brand{padding:4px 8px 14px}
.nav{display:flex;gap:12px;align-items:center;padding:13px 12px;border:0;background:none;font-weight:700;text-align:left;border-radius:12px;cursor:pointer}
.nav.on{background:var(--bg);color:var(--brand)}
.sos{margin-top:auto;padding:12px;border-radius:12px;background:var(--bg);color:var(--mut);font-size:13px}.sos b{color:var(--ink)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#cd{position:absolute;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:600;background:var(--card);border-radius:18px;padding:16px 16px 14px;box-shadow:0 6px 24px #0004;display:none;max-width:420px}#cd.on{display:block}
#cd h3{margin:2px 0 4px;font-size:17px;padding-right:32px}#cd p{margin:0 0 8px;color:var(--mut);font-size:14px}
#cd .x{position:absolute;top:10px;right:10px;width:34px;height:34px;border:0;border-radius:10px;background:var(--bg);cursor:pointer}
#cd a{display:inline-block;margin-top:8px;padding:10px 16px;border-radius:12px;background:var(--brand);color:#fff;text-decoration:none;font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:2px 8px}.pin.on{transform:scale(1.35);box-shadow:0 0 0 4px #fff8}
#map{z-index:0}#ub{margin-left:auto}.chip{padding:11px 16px}.rt button{padding:8px 11px}
#st{bottom:calc(22px + env(safe-area-inset-bottom,0px))}#loc{width:46px;height:46px;bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.pop{max-width:68vw}
.md{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:3000;padding:16px}.md.on{display:flex}
.bx{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}.bx h3{margin:0;font-size:20px;word-break:break-all}
.bx input{padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink)}
.bx button{padding:13px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}.bx .alt{background:var(--bg);color:var(--ink)}
.bx .row{display:flex;gap:8px}.bx .row button{flex:1}#ae{margin:0;color:#b91c1c;font-size:13px;min-height:1em}
@media (max-width:520px){.brand small{display:none}.wrap{padding:14px 12px 32px}#dr{width:86%}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="logo" viewBox="0 0 40 40"><rect width="40" height="40" rx="12" fill="#1b3a5c"/><path d="M20 5c-6 0-10.500 4.400-10.500 10.200C9.500 23 20 35 20 35s10.500-12 10.500-19.800C30.500 9.400 26 5 20 5z" fill="#f5a524"/><circle cx="20" cy="15" r="5.500" fill="#fff" stroke="#1b3a5c" stroke-width="1.800"/><path d="M20 15v5M20 15l-4.500-2.500M20 15l4.500-2.500" stroke="#1b3a5c" stroke-width="1.600" stroke-linecap="round"/></symbol></svg>
<header><button class="bb" id="bb" aria-label="Меню">☰</button><div class="brand"><svg><use href="#logo"/></svg><div><b>Штурман</b><small>справочник автомобилиста · Москва</small></div></div><button class="bb" id="ub" aria-label="Аккаунт">👤</button></header>
<div id="sh"></div>
<nav id="dr"><div class="brand"><svg><use href="#logo"/></svg><div><b>Штурман</b><small>справочник автомобилиста</small></div></div>
<button class="nav" data-k="all">🗺️ Вся карта</button><button class="nav" data-k="p">🅿️ Парковки</button><button class="nav" data-k="r">🔧 Ремонт и шиномонтаж</button><button class="nav" data-k="g">⛽ АЗС и топливо</button><button class="nav" data-k="faults">⚠️ Неисправности</button><button class="nav" data-k="check">✅ Чек-лист перед поездкой</button>
<div class="sos">Экстренные службы: <b>112</b><br>Карта и данные: 2ГИС</div></nav>
<main>
<section class="v on" id="v-map" style="overflow:hidden"><div id="map"></div><div class="chips" id="chips"></div><button id="loc" aria-label="Где я">📍</button><div id="cd"></div><div id="st">Загружаю…</div></section>
<section class="v" id="v-faults"><div class="wrap"><h2>Что проверить первым делом</h2><p>Нажмите на симптом — увидите шаги по порядку.</p><div id="fl"></div></div></section>
<section class="v" id="v-check"><div class="wrap"><h2>Перед поездкой</h2><p>Две минуты — и меньше сюрпризов в дороге.</p><div class="bar"><i id="pb"></i></div><div id="cl"></div></div></section>
</main>
<div class="md" id="au"><div class="bx"><h3 id="at">Вход</h3><div id="af" style="display:contents"><input id="em" type="email" placeholder="Почта" autocomplete="email"><input id="pw" type="password" placeholder="Пароль от 6 символов" autocomplete="current-password"><div class="row"><button id="li">Войти</button><button id="rg" class="alt">Регистрация</button></div><button id="go" class="alt">Войти через Google</button></div><p id="ae"></p><button id="lo" class="alt" hidden>Выйти</button><button id="ax" class="alt">Закрыть</button></div></div>
<script src="https://mapgl.2gis.com/api/js/v1"></script>
<script>
// === Необязательно: оценки качества топлива через Firebase Firestore ===
// Замените "ВАШ_API_KEY" и "ВАШ_APP_ID" на значения из Firebase: Project settings → Your apps → Web.
// Пока там стоят заглушки, оценки отключены и карта работает как обычно.
// Ключ 2ГИС: dev.2gis.ru → личный кабинет → ключ для Web. В настройках ключа ограничьте его вашим доменом.
const DGIS_KEY='YOUR_API_KEY';
const FB_CONFIG={
  apiKey: "ВАШ_API_KEY",
  authDomain: "navisturman.firebaseapp.com",
  projectId: "navisturman",
  storageBucket: "navisturman.firebasestorage.app",
  messagingSenderId: "440183867418",
  appId: "ВАШ_APP_ID"
};

const C={p:{n:'Парковки',i:'🅿️',c:'#3b82f6',q:['парковка']},r:{n:'Ремонт',i:'🔧',c:'#f26b1d',q:['автосервис','шиномонтаж']},g:{n:'АЗС',i:'⛽',c:'#16a34a',q:['АЗС']}};
const F=[['Не заводится: стартер молчит или щёлкает',['Клеммы и заряд аккумулятора (нужно от 12,4 В).','Селектор в P/N, нажата педаль тормоза или сцепления.','Предохранители и реле стартера.']],
['Стартер крутит, но мотор не схватывает',['Есть ли топливо в баке.','Слышно ли бензонасос при включении зажигания.','Свечи зажигания и датчик коленвала.']],
['Горит Check Engine',['Затяните крышку бака и проедьте немного.','Считайте ошибки OBD2-сканером.','Если лампа мигает — не ехать, вызвать эвакуатор.']],
['Перегрев двигателя',['Остановиться и заглушить мотор.','Не открывать горячий бачок — подождать 20–30 минут.','Уровень антифриза, вентилятор, термостат.']],
['Вибрация руля',['Давление в шинах и балансировка колёс.','Грыжи и вздутия на шинах.','Если бьёт при торможении — тормозные диски.']],
['Быстро садится аккумулятор',['Напряжение на заведённом моторе: 13,8–14,4 В.','Утечка тока при выключенном зажигании.','Клеммы и ремень генератора.']]];
const K=['Давление в шинах','Уровень масла','Антифриз','Омывайка и щётки','Свет и поворотники','Документы и страховка','Аптечка, знак, огнетушитель','Топлива хватает до заправки'];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let map=null,f='all',seq=0,timer,last='',db=null,auth=null,user=null,mk=[],items=[];
const st=t=>$('#st').textContent=t;
if(!DGIS_KEY||DGIS_KEY=='YOUR_API_KEY')st('Добавьте ключ 2ГИС в код (DGIS_KEY)');
else try{map=new mapgl.Map('map',{center:[37.6173,55.7558],zoom:11,key:DGIS_KEY,zoomControl:'bottomRight'})}catch(e){map=null;st('Карта не загрузилась. Проверьте ключ 2ГИС и интернет.')}
async function q2(qs,vp){for(const fl of['items.point,items.address_name,items.schedule','items.point,items.address_name']){let out=[],tot=0,ok=1;
for(const p of[1,2]){const j=await(await fetch(`https://catalog.api.2gis.ru/3.0/items?q=${encodeURIComponent(qs)}&type=branch&viewpoint1=${vp[0]}&viewpoint2=${vp[1]}&fields=${fl}&page_size=50&page=${p}&key=${DGIS_KEY}`)).json();
if(j.meta?.code==404)break;if(j.meta?.code!=200){ok=0;break}const r=j.result;out=out.concat(r.items||[]);tot=r.total||0;if(out.length>=tot)break}
if(ok)return{out,tot}}throw 0}
function draw(){mk.forEach(m=>m.destroy());mk=items.map((d,i)=>new mapgl.HtmlMarker(map,{coordinates:[d.lon,d.lat],html:`<div class="pin" data-i="${i}" style="background:${C[d.k].c}">${C[d.k].i}</div>`,anchor:[14,14]}))}
async function load(force){if(!map)return;const id=++seq;
try{const b=map.getBounds(),sw=b.southWest,ne=b.northEast,vp=[sw[0].toFixed(5)+','+ne[1].toFixed(5),ne[0].toFixed(5)+','+sw[1].toFixed(5)],key=f+vp;
if(!force&&key==last){seq--;return}last=key;st('Загружаю…');
const rs=await Promise.all(Object.keys(C).filter(k=>f=='all'||f==k).flatMap(k=>C[k].q.map(qs=>q2(qs,vp).then(r=>({k,r})))));
if(id!=seq)return;let tot=0,all=[];
rs.forEach(({k,r})=>{tot+=r.tot;r.out.filter(x=>x.point).forEach(x=>all.push({id:x.id,k,n:x.name,lon:x.point.lon,lat:x.point.lat,a:x.address_name||'',h:x.schedule?.is_24x7?'Круглосуточно':''}))});
const seen=new Set();items=all.filter(d=>!seen.has(d.id)&&seen.add(d.id));closeCard();draw();
st(items.length?(items.length<tot?`Показано ${items.length} из ${tot} — приблизьте карту`:`Найдено: ${items.length}`):'Здесь ничего не найдено')}
catch(e){if(id==seq){last='';st('Не удалось загрузить данные. Проверьте ключ 2ГИС.')}}}
function closeCard(){$('#cd').classList.remove('on');document.querySelectorAll('.pin.on').forEach(e=>e.classList.remove('on'))}
function pick(i){const d=items[i];document.querySelectorAll('.pin').forEach(e=>e.classList.toggle('on',+e.dataset.i===i));
$('#cd').innerHTML=`<button class="x" aria-label="Закрыть">✕</button><span class="tag" style="background:${C[d.k].c}">${C[d.k].n}</span><h3>${esc(d.n||C[d.k].n)}</h3><p>${esc([d.a,d.h].filter(Boolean).join(' · '))}</p>${d.k=='g'?'<div class="rt"></div>':''}<a href="https://2gis.ru/moscow/firm/${esc(String(d.id).split('_')[0])}" target="_blank" rel="noopener">Открыть в 2ГИС</a>`;
$('#cd').classList.add('on');if(d.k=='g')rate(d.id,$('#cd .rt'))}
$('#map').addEventListener('click',e=>{const p=e.target.closest('.pin');if(p)pick(+p.dataset.i)});
$('#cd').onclick=e=>{if(e.target.closest('.x'))closeCard()};
if(map){const sc=()=>{clearTimeout(timer);timer=setTimeout(()=>load(),700)};['moveend','centerend','zoomend','dragend','styleload'].forEach(ev=>map.on(ev,sc))}
$('#loc').onclick=()=>navigator.geolocation&&map&&navigator.geolocation.getCurrentPosition(p=>{map.setCenter([p.coords.longitude,p.coords.latitude]).setZoom(15)},()=>st('Нет доступа к геолокации'));
async function rate(sid,el){if(!db||!el)return;let n=0,t=0,mine=0;
try{(await db.collection('votes').where('sid','==',sid).get()).forEach(d=>{const x=d.data();n++;t+=x.v;if(user&&x.uid==user.uid)mine=x.v})}catch(err){el.textContent='Оценки временно недоступны';return}
el.innerHTML=`Качество топлива: ${n?'★ '+(t/n).toFixed(1)+' ('+n+')':'пока нет оценок'}<div>`+(user?[1,2,3,4,5].map(i=>`<button data-v="${i}"${i==mine?' style="background:#fde68a"':''}>${i}★</button>`).join(''):'<button data-login="1">Войдите, чтобы оценить</button>')+'</div>';
el.onclick=async ev=>{if(ev.target.dataset.login)return openAuth();const v=+ev.target.dataset.v;if(!v||!user)return;try{await db.collection('votes').doc(sid+'_'+user.uid).set({sid,uid:user.uid,v});el.textContent='Спасибо за оценку!'}catch(err){el.textContent='Не удалось сохранить оценку'}}}
function chips(){$('#chips').innerHTML=[['all','Все'],['p','🅿️ Парковки'],['r','🔧 Ремонт'],['g','⛽ АЗС']].map(c=>`<button class="chip${f==c[0]?' on':''}" data-k="${c[0]}">${c[1]}</button>`).join('')}
function tab(k){document.body.classList.remove('open');document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.k==k));
const m=['all','p','r','g'].includes(k);document.querySelectorAll('.v').forEach(v=>v.classList.remove('on'));$(m?'#v-map':'#v-'+k).classList.add('on');
if(m){f=k;chips();if(map){load(1)}}}
$('#chips').onclick=e=>{const c=e.target.closest('.chip');if(c)tab(c.dataset.k)};
$('#dr').onclick=e=>{const n=e.target.closest('.nav');if(n)tab(n.dataset.k)};
$('#bb').onclick=()=>document.body.classList.add('open');$('#sh').onclick=()=>document.body.classList.remove('open');
// Оценки топлива
async function fb(){if(!FB_CONFIG||/ВАШ/.test(FB_CONFIG.apiKey+FB_CONFIG.appId))return;for(const s of['app','auth','firestore'])await new Promise(r=>{const x=document.createElement('script');x.src=`https://www.gstatic.com/firebasejs/10.12.2/firebase-${s}-compat.js`;x.onload=r;document.head.append(x)});firebase.initializeApp(FB_CONFIG);db=firebase.firestore();auth=firebase.auth();auth.onAuthStateChanged(u=>{user=u;acct()})}

$('#fl').innerHTML=F.map(x=>`<details><summary>${x[0]}</summary><ol>${x[1].map(s=>`<li>${s}</li>`).join('')}</ol></details>`).join('');
let ck=[];try{ck=JSON.parse(localStorage.getItem('ck')||'[]')}catch(e){}
function cl(){$('#cl').innerHTML=K.map((t,i)=>`<label class="ck${ck.includes(i)?' d':''}"><input type="checkbox" data-i="${i}"${ck.includes(i)?' checked':''}><span>${t}</span></label>`).join('');$('#pb').style.width=ck.length/K.length*100+'%'}
$('#cl').onchange=e=>{const i=+e.target.dataset.i;ck=e.target.checked?[...ck,i]:ck.filter(x=>x!==i);try{localStorage.setItem('ck',JSON.stringify(ck))}catch(x){}cl()};
// Авторизация
function acct(){$('#ub').textContent=user?'✅':'👤';$('#at').textContent=user?(user.email||'Вы вошли'):'Вход';$('#af').style.display=user?'none':'contents';$('#lo').hidden=!user;$('#ae').textContent=''}
function openAuth(){$('#au').classList.add('on');if(!auth)$('#ae').textContent='Вход пока не настроен: добавьте ключи Firebase в код.'}
const shut=()=>$('#au').classList.remove('on');
$('#ub').onclick=openAuth;$('#ax').onclick=shut;$('#au').onclick=e=>{if(e.target.id=='au')shut()};
const run=p=>{$('#ae').textContent='';if(!auth)return openAuth();p().then(shut).catch(e=>$('#ae').textContent=({'auth/invalid-credential':'Неверная почта или пароль','auth/email-already-in-use':'Эта почта уже зарегистрирована','auth/weak-password':'Пароль короче 6 символов','auth/invalid-email':'Проверьте адрес почты','auth/popup-closed-by-user':''})[e.code]??'Не получилось. Попробуйте ещё раз.')};
$('#li').onclick=()=>run(()=>auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value));
$('#rg').onclick=()=>run(()=>auth.createUserWithEmailAndPassword($('#em').value.trim(),$('#pw').value));
$('#go').onclick=()=>run(()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()));
$('#lo').onclick=()=>auth&&auth.signOut().then(shut);
cl();fb();tab('all');
</script></body></html>
